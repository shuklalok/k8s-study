apiVersion: v1
kind: Pod
metadata:
  name: multi-container
  labels:
    app: multi-container
spec:
  volumes:
  - name: shared-logs
    emptyDir: {}
  containers:
  - name: app
    image: nginx:1.27
    ports:
    - containerPort: 80
    volumeMounts:
    - name: shared-logs
      mountPath: /var/log/nginx
  - name: sidecar
    image: busybox:1.36
    command: ["/bin/sh", "-c", "while true; do echo $(date) >> /var/log/app.log; sleep 10; done"]
    volumeMounts:
    - name: shared-logs
      mountPath: /var/log
